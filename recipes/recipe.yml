# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: warbreed-os
description: Personal Fedora Kinoite spin with CachyOS Kernel and Flatpak Firefox.

base-image: ghcr.io/blue-build/base-images/fedora-kinoite
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  # Enable COPR repositories natively via BlueBuild copr module
  - type: copr
    enable:
      - ptitseb/cachyos
      - atim/starship

  # Package management & kernel swap
  - type: rpm-ostree
    install:
      - micro
      - starship
    remove:
      - firefox
      - firefox-langpacks
    replace:
      - from-repo: copr:copr.fedorainfracloud.org:ptitseb:cachyos
        packages:
          - kernel
          - kernel-core
          - kernel-modules
          - kernel-modules-extra

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
      - scope: user

  - type: signing
