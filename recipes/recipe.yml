
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: warbreed-os
description: Custom Fedora Kinoite spin with CachyOS Kernel.

base-image: quay.io/fedora/fedora-kinoite
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/bieszczaders/kernel-cachyos/repo/fedora-%OS_VERSION%/bieszczaders-kernel-cachyos-fedora-%OS_VERSION%.repo
      - https://copr.fedorainfracloud.org/coprs/atim/starship/repo/fedora-%OS_VERSION%/atim-starship-fedora-%OS_VERSION%.repo

    install:
      - micro
      - starship
      - kernel-cachyos

    remove:
  # Original Fedora kernel
  - kernel
  - kernel-core
  - kernel-modules
  - kernel-modules-core
  - kernel-modules-extra

  # Firefox
  - firefox
  - firefox-langpacks

  # KDE Discover
  - plasma-discover
  - plasma-discover-notifier
  - plasma-discover-flatpak
  - plasma-discover-rpm-ostree
      

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - com.stremio.Stremio
          - com.spotify.Client
          - io.github.kolunmi.Bazaar
          - com.valvesoftware.Steam
          - it.mijorus.gearlever
          - com.github.tchx84.Flatseal
          - com.vysp3r.ProtonPlus
          - ru.linux_gaming.PortProton
          - flathub fm.reaper.Reaper
          - com.bandpassrecords.dpm
          - com.obsproject.Studio
          - com.obsproject.Studio.Plugin.OBSVkCapture
          - com.obsproject.Studio.Plugin.AitumMultistream
          - com.obsproject.Studio.Plugin.StrokeGlowShadow
          - org.qbittorrent.qBittorrent
          - org.freedesktop.Platform.VulkanLayer.OBSVkCapture
          - flathub org.fooyin.fooyin
          
      - scope: user

  - type: signing
