# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: warbreed-os
description: Custom Fedora Kinoite spin with CachyOS Kernel.

base-image: ghcr.io/blue-build/base-images/fedora-kinoite
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/ptitseb/cachyos/repo/fedora-%OS_VERSION%/ptitseb-cachyos-fedora-%OS_VERSION%.repo
      - https://copr.fedorainfracloud.org/coprs/atim/starship/repo/fedora-%OS_VERSION%/atim-starship-fedora-%OS_VERSION%.repo
    install:
      - micro
      - starship
    remove:
      - firefox
      - firefox-langpacks
    replace:
      - from-repo: https://copr.fedorainfracloud.org/coprs/ptitseb/cachyos/repo/fedora-%OS_VERSION%/ptitseb-cachyos-fedora-%OS_VERSION%.repo
        packages:
          - kernel
          - kernel-core
          - kernel-modules
          - kernel-modules-extra

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
      - scope: user

  - type: signing
