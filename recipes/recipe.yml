# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: warbreed-os
description: Custom Fedora Kinoite spin with CachyOS Kernel.

base-image: quay.io/fedora/fedora-kinoite
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/bieszczaders/kernel-cachyos/repo/fedora-%OS_VERSION%/bieszczaders-kernel-cachyos-fedora-%OS_VERSION%.repo
      - https://copr.fedorainfracloud.org/coprs/atim/starship/repo/fedora-%OS_VERSION%/atim-starship-fedora-%OS_VERSION%.repo
      - https://copr.fedorainfracloud.org/coprs/lilay/topgrade/repo/fedora-%OS_VERSION%/lilay-topgrade-fedora-%OS_VERSION%.repo

    install:
      - topgrade
      - kernel-cachyos
      - fastfetch
      - git
      - curl
      - kwrite
      - kde-partitionmanager

    remove:
      - kernel
      - kernel-core
      - kernel-modules
      - kernel-modules-core
      - kernel-modules-extra
      - firefox
      - firefox-langpacks
      - plasma-discover
      - plasma-discover-libs
      - plasma-discover-notifier
      - plasma-discover-flatpak
      - plasma-discover-rpm-ostree
      - plasma-discover-kns
      - fedora-repos-archive

      
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
          - org.mozilla.firefox
          - org.pvermeer.WebAppHub
          - com.stremio.Stremio
          - com.spotify.Client
          - io.github.kolunmi.Bazaar
          - com.valvesoftware.Steam
          - it.mijorus.gearlever
          - com.github.tchx84.Flatseal
          - com.vysp3r.ProtonPlus
          - ru.linux_gaming.PortProton
          - fm.reaper.Reaper
          - com.bandpassrecords.dpm
          - com.obsproject.Studio
          - com.obsproject.Studio.Plugin.OBSVkCapture
          - com.obsproject.Studio.Plugin.AitumMultistream
          - com.obsproject.Studio.Plugin.StrokeGlowShadow
          - com.obsproject.Studio.Plugin.PipeWireAudioCapture
          - com.obsproject.Studio.Plugin.Countdown
          - com.obsproject.Studio.Plugin.OBSPWVideo
          - com.obsproject.Studio.Plugin.Gstreamer
          - com.chatterino.chatterino
          - org.qbittorrent.qBittorrent
          - org.freedesktop.Platform.VulkanLayer.OBSVkCapture
          - org.fooyin.fooyin
          - com.discordapp.Discord
          - com.wps.Office
          - com.heroicgameslauncher.hgl
          - org.videolan.VLC

      - scope: user

  - type: signing
