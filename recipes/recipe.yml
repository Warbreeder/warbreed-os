# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Image will be published to ghcr.io/<user>/warbreed-os
name: warbreed-os
description: Personal Fedora Kinoite spin with CachyOS Kernel and Flatpak Firefox.

# Base image set to Fedora Kinoite (KDE Plasma)
base-image: ghcr.io/blue-build/base-images/fedora-kinoite
image-version: latest

modules:
  # Copy local repo system files if present (files/system/* -> /)
  - type: files
    files:
      - source: system
        destination: /

  # Pull CachyOS repository and swap out the stock Linux kernel
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/ptitseb/cachyos/repo/fedora-%OS_VERSION%/ptitseb-cachyos-fedora-%OS_VERSION%.repo
      - https://copr.fedorainfracloud.org/coprs/atim/starship/repo/fedora-%OS_VERSION%/atim-starship-fedora-%OS_VERSION%.repo
    install:
      - micro
      - starship
    remove:
      - firefox
      - firefox-langpacks
    replace:
      - from-repo: https://copr.fedorainfracloud.org/coprs/ptitseb/cachyos/repo/fedora-%OS_VERSION%/ptitseb-cachyos-fedora-%OS_VERSION%.repo
        packages:
          - kernel
          - kernel-core
          - kernel-modules
          - kernel-modules-extra

  # Configure System & User Flatpaks
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
      - scope: user

  # Enforce image signing policy
  - type: signing
