# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: warbreed-os
description: Custom Fedora Kinoite spin with CachyOS Kernel.

base-image: ghcr.io/blue-build/base-images/fedora-kinoite
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  # Enable COPR repositories natively
  - type: copr
    enable:
      - ptitseb/cachyos
      - atim/starship

  # Swap stock kernel for CachyOS cleanly
  - type: rpm-ostree
    install:
      - micro
      - starship
    remove:
      - firefox
      - firefox-langpacks
      - kernel
      - kernel-core
      - kernel-modules
      - kernel-modules-extra
    replace:
      - from-repo: ptitseb-cachyos
        packages:
          - kernel-cachyos
          - kernel-cachyos-core
          - kernel-cachyos-modules
          - kernel-cachyos-modules-extra

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
      - scope: user

  - type: signing
